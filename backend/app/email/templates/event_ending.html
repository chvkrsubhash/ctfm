<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><title>Event Ending Soon — $app_name</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0e1a;font-family:'Segoe UI',Arial,sans-serif;color:#e2e8f0}.wrapper{max-width:600px;margin:40px auto;background:#111827;border-radius:16px;overflow:hidden;border:1px solid #1e2a3d}.header{background:linear-gradient(135deg,#b45309,#92400e);padding:40px 32px;text-align:center;border-bottom:1px solid #1e2a3d}.emoji{font-size:48px;margin-bottom:8px}.logo{font-size:24px;font-weight:700;color:#fef3c7}.body{padding:40px 32px}h1{font-size:22px;color:#f1f5f9;margin-bottom:16px}p{color:#94a3b8;line-height:1.7;margin-bottom:16px}.time-box{background:#1c1917;border:1px solid #b45309;border-radius:12px;padding:20px;text-align:center;margin:24px 0}.time-label{font-size:12px;color:#f59e0b;text-transform:uppercase;letter-spacing:2px}.time-value{font-size:22px;font-weight:700;color:#fef3c7;margin-top:8px}.btn{display:inline-block;background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff!important;text-decoration:none;padding:14px 32px;border-radius:8px;font-weight:600;font-size:15px;margin:24px 0}.footer{padding:24px 32px;text-align:center;font-size:12px;color:#475569;border-top:1px solid #1e2a3d}.footer a{color:#38bdf8;text-decoration:none}</style></head>
<body><div class="wrapper">
  <div class="header"><div class="emoji">⏰</div><div class="logo">$event_name</div></div>
  <div class="body">
    <h1>Last chance — event ending soon!</h1>
    <p>Hi <strong style="color:#f1f5f9">$username</strong>,</p>
    <p><strong style="color:#fef3c7">$event_name</strong> is ending soon. Submit any remaining flags now before time runs out!</p>
    <div class="time-box">
      <div class="time-label">End Time</div>
      <div class="time-value">$end_time</div>
    </div>
    <p style="text-align:center"><a class="btn" href="$event_url">Go to Challenges</a></p>
  </div>
  <div class="footer"><p>$app_name · <a href="$frontend_url">$frontend_url</a></p></div>
</div></body></html>
