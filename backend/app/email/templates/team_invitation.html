<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><title>Team Invitation — $app_name</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0e1a;font-family:'Segoe UI',Arial,sans-serif;color:#e2e8f0}.wrapper{max-width:600px;margin:40px auto;background:#111827;border-radius:16px;overflow:hidden;border:1px solid #1e2a3d}.header{background:linear-gradient(135deg,#1a1f35,#0f172a);padding:40px 32px;text-align:center;border-bottom:1px solid #1e2a3d}.logo{font-size:24px;font-weight:700;color:#38bdf8}.body{padding:40px 32px}h1{font-size:22px;color:#f1f5f9;margin-bottom:16px}p{color:#94a3b8;line-height:1.7;margin-bottom:16px}.team-card{background:#0f172a;border:1px solid #1e2a3d;border-radius:12px;padding:20px;margin:24px 0;text-align:center}.team-name{font-size:20px;font-weight:700;color:#38bdf8}.event-name{font-size:14px;color:#64748b;margin-top:4px}.btn-accept{display:inline-block;background:linear-gradient(135deg,#10b981,#059669);color:#fff!important;text-decoration:none;padding:14px 32px;border-radius:8px;font-weight:600;font-size:15px;margin:8px}.btn-decline{display:inline-block;background:#1e2a3d;color:#94a3b8!important;text-decoration:none;padding:14px 32px;border-radius:8px;font-weight:600;font-size:15px;margin:8px}.footer{padding:24px 32px;text-align:center;font-size:12px;color:#475569;border-top:1px solid #1e2a3d}.footer a{color:#38bdf8;text-decoration:none}</style></head>
<body><div class="wrapper">
  <div class="header"><div class="logo">CTF<span style="color:#e2e8f0">Platform</span></div></div>
  <div class="body">
    <h1>Team Invitation</h1>
    <p>Hi <strong style="color:#f1f5f9">$invitee_name</strong>,</p>
    <p><strong style="color:#f1f5f9">$inviter_name</strong> has invited you to join their team for <strong style="color:#38bdf8">$event_name</strong>.</p>
    <div class="team-card">
      <div class="team-name">$team_name</div>
      <div class="event-name">$event_name</div>
    </div>
    <p style="text-align:center">
      <a class="btn-accept" href="$invitation_url">Accept Invitation</a>
    </p>
    <p>This invitation expires in 48 hours. If you didn't expect this, you can safely ignore it.</p>
  </div>
  <div class="footer"><p>$app_name · <a href="$frontend_url">$frontend_url</a></p></div>
</div></body></html>
