<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><title>Certificate — $app_name</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0e1a;font-family:'Segoe UI',Arial,sans-serif;color:#e2e8f0}.wrapper{max-width:600px;margin:40px auto;background:#111827;border-radius:16px;overflow:hidden;border:1px solid #1e2a3d}.header{background:linear-gradient(135deg,#854d0e,#713f12);padding:40px 32px;text-align:center;border-bottom:1px solid #1e2a3d}.emoji{font-size:56px;margin-bottom:8px}.logo{font-size:24px;font-weight:700;color:#fef3c7}.body{padding:40px 32px;text-align:center}h1{font-size:22px;color:#f1f5f9;margin-bottom:16px}p{color:#94a3b8;line-height:1.7;margin-bottom:16px}.cert-card{background:linear-gradient(135deg,#1c1917,#292524);border:1px solid #a16207;border-radius:16px;padding:32px;margin:24px 0}.cert-name{font-size:28px;font-weight:700;color:#fef3c7;margin-bottom:8px}.cert-event{font-size:16px;color:#a16207;margin-bottom:24px}.cert-stats{display:flex;justify-content:center;gap:32px;margin-top:16px}.cert-stat-label{font-size:11px;color:#78716c;text-transform:uppercase;letter-spacing:1px}.cert-stat-value{font-size:20px;font-weight:700;color:#fbbf24;margin-top:4px}.btn{display:inline-block;background:linear-gradient(135deg,#d97706,#b45309);color:#fff!important;text-decoration:none;padding:14px 32px;border-radius:8px;font-weight:600;font-size:15px;margin:24px 0}.footer{padding:24px 32px;text-align:center;font-size:12px;color:#475569;border-top:1px solid #1e2a3d}.footer a{color:#38bdf8;text-decoration:none}</style></head>
<body><div class="wrapper">
  <div class="header"><div class="emoji">🏆</div><div class="logo">Certificate of Achievement</div></div>
  <div class="body">
    <h1>Congratulations, $username!</h1>
    <p>You've earned a certificate for your performance in <strong style="color:#fbbf24">$event_name</strong>.</p>
    <div class="cert-card">
      <div class="cert-name">$username</div>
      <div class="cert-event">$event_name</div>
      <div class="cert-stats">
        <div><div class="cert-stat-label">Rank</div><div class="cert-stat-value">$rank</div></div>
        <div><div class="cert-stat-label">Score</div><div class="cert-stat-value">$score</div></div>
      </div>
    </div>
    <a class="btn" href="$certificate_url">View Certificate</a>
    <p style="font-size:13px">Share this certificate URL to let others verify your achievement.</p>
  </div>
  <div class="footer"><p>$app_name · <a href="$frontend_url">$frontend_url</a></p></div>
</div></body></html>
